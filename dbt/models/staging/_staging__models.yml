version: 2

models:
  - name: stg_orders
    description: "Staging layer for Olist orders -- 1:1 mapping of raw.orders with explicit typing"
    columns:
      - name: order_id
        description: "Unique order identifier, primary key"
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "ID of the customer who placed the order"
        data_tests:
          - not_null
      - name: order_status
        description: "Order status"
        data_tests:
          - not_null
          - accepted_values:
              values: ['delivered', 'shipped', 'canceled', 'unavailable',
                       'invoiced', 'processing', 'created', 'approved']

  - name: stg_customers
    description: "Staging layer for customers. customer_id is unique per order, customer_unique_id -- per person"
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: "Real unique customer (can appear multiple times for repeat purchases)"
        data_tests:
          - not_null
      - name: customer_state
        data_tests:
          - not_null
      - name: customer_zip_code_prefix
        description: "ZIP code prefix used to locate the customer geographically. KNOWN DATA QUALITY ISSUE: ~0.3% of customers have a zip prefix not found in stg_geolocation (likely rare/incomplete postal codes). In a real-world scenario, this reference table would be enriched with missing zip codes; treated as warn since it doesn't affect non-geographic metrics."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_geolocation')
              field: geolocation_zip_code_prefix
              config:
                severity: warn

  - name: stg_order_items
    description: "Staging layer for order line items. order_id is not unique (one order -- many items)"
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: product_id
        data_tests:
          - not_null
      - name: price
        description: "Item price, must be positive"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false

  - name: stg_order_payments
    description: "Staging layer for order payments. order_id is not unique (multiple payment methods per order)"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - order_id
            - payment_sequential
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: payment_type
        description: "Payment method"
        data_tests:
          - not_null
          - accepted_values:
              values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined']
      - name: payment_value
        description: "Payment amount, must be positive or 0"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
      - name: payment_installments
        description: "Number of installments, must be positive or 0"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true

  - name: stg_order_reviews
    description: "Staging layer for order reviews. review_id is not guaranteed unique -- some reviews appear twice with identical content but different order_id, likely a data export issue upstream. Both rows are kept since the correct order_id cannot be determined."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - order_id
            - review_id
      - dbt_utils.expression_is_true:
          expression: "review_answer_timestamp >= review_creation_date"
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: review_score
        description: "Order evaluation by customer, 1 to 5"
        data_tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5]
              quote: false

  - name: stg_products
    description: "Staging layer for products. Provides physical characteristics of each product. KNOWN DATA QUALITY ISSUE: some products have null product_category_name (orphan products, not discoverable by customers via category browsing) or null product_name_length (likely a broken listing). These rows are kept here for referential integrity with order_items, but should be excluded from customer-facing / sales analysis in the marts layer."
    columns:
      - name: product_id
        description: "Unique product identifier, primary key"
        data_tests:
          - unique
          - not_null

      - name: product_category_name
        description: "Product category. NULL indicates an orphan product not browsable by category -- known data quality issue, see model description"
        data_tests:
          - not_null:
              config:
                severity: warn

      - name: product_name_length
        description: "Length of product title. NULL likely indicates a broken/incomplete listing -- known data quality issue, see model description"
        data_tests:
          - not_null:
              config:
                severity: warn

  - name: stg_sellers
    description: "Staging layer for sellers. seller_id is unique primary key, remaining columns describe seller address"
    columns:
      - name: seller_id
        description: "Unique seller identifier, primary key"
        data_tests:
          - unique
          - not_null
      - name: seller_zip_code_prefix
        description: "ZIP code prefix used to locate the seller geographically. KNOWN DATA QUALITY ISSUE: a small number of sellers have a zip prefix not found in stg_geolocation. See stg_customers for the same known limitation."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_geolocation')
              field: geolocation_zip_code_prefix
              config:
                severity: warn

  - name: stg_geolocation
    description: "Staging layer for Brazilian geolocation data (zip code prefix to lat/lng mapping). KNOWN DATA QUALITY ISSUE: the combination of zip_code_prefix, lat and lng contains duplicate rows in the source data (~13% of rows). These are treated as non-critical (warn) since they don't distort individual coordinate values, only inflate row counts if not deduplicated downstream."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - geolocation_zip_code_prefix
            - geolocation_lat
            - geolocation_lng
          config:
            severity: warn
    columns:
      - name: geolocation_zip_code_prefix
        data_tests:
          - not_null
      - name: geolocation_lat
        description: "Latitude, must be within valid geographic bounds"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: -90
              max_value: 90
              inclusive: true
      - name: geolocation_lng
        description: "Longitude, must be within valid geographic bounds"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: -180
              max_value: 180
              inclusive: true
